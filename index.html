<script type="text/babel">
function readLang() {
  try { return localStorage.getItem('yc-smb-lang') || 'en'; } catch (e) { return 'en'; }
}

// Fade sections in as they scroll into view, like youcloud.ae.
// Content stays visible if IntersectionObserver is missing.
function useReveal(lang) {
  React.useEffect(() => {
    if (!('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('js-reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
    document.querySelectorAll('.reveal:not(.in)').forEach(el => io.observe(el));
    return () => io.disconnect();
  }, [lang]);
}

function App() {
  const [lang, setLangState] = React.useState(readLang);
  const t = YC_STRINGS[lang] || YC_STRINGS.en;
  const [form, setForm] = React.useState(null);
  const openForm = (k) => setForm(k);
  React.useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    try { localStorage.setItem('yc-smb-lang', lang); } catch (e) {}
  }, [lang]);
  useReveal(lang);
  return (
    <>
      <Nav t={t} lang={lang} setLang={setLangState} openForm={openForm} />
      <main>
        <Hero t={t} lang={lang} openForm={openForm} />
        <CertStrip t={t} />
        <HowItWorks t={t} />
        <Merchants t={t} />
        <SellOnline t={t} />
        <Campaigns t={t} />
        <StatBand t={t} />
        <FinalCTA t={t} openForm={openForm} />
      </main>
      <Footer t={t} openForm={openForm} />
      <WhatsAppFab lang={lang} onClick={() => openForm('whatsapp')} />
      {form === 'enquiry' && <EnquiryForm lang={lang} onClose={() => setForm(null)} onWhatsApp={() => setForm('whatsapp')} />}
      {form === 'whatsapp' && <WhatsAppSheet lang={lang} onClose={() => setForm(null)} />}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
